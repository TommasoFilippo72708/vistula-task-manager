<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Contribution</title>
</head>
<body>
  <h1>Team Contribution</h1>

  <button id="load-contributor">Show Contributor</button>

  <p>Contributor student ID: <span id="contributor-student-id"></span></p>

  <a href="index.html">Back to main page</a>

  <script>
    document.getElementById('load-contributor').addEventListener('click', async () => {
      const output = document.getElementById('contributor-student-id');
      try {
        const response = await fetch('contribution.json');
        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }
        const data = await response.json();
        output.textContent = data.contributorStudentId;
      } catch (err) {
        output.textContent = 'Could not load contribution.json';
      }
    });
  </script>
</body>
</html>
