<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple Task Manager application powered by Supabase.">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

<main class="container">

    <header class="page-header">
        <h1>Task Manager</h1>
        <p id="student-id">Student ID: 72708</p>
    </header>

    <section class="task-section">
        <h2 id="form-heading">Add a task</h2>

        <form id="task-form">
            <div class="form-group">
                <label for="task-title">Task title</label>
                <input
                        type="text"
                        id="task-title"
                        placeholder="Enter task title"
                        required
                >
            </div>

            <div class="form-group">
                <label for="task-description">Description</label>
                <textarea
                        id="task-description"
                        placeholder="Enter task description"
                        rows="3"
                ></textarea>
            </div>

            <button type="submit" id="task-submit">
                Add task
            </button>
        </form>
    </section>

    <section class="task-section">
        <div class="list-header">
            <h2>Your tasks</h2>
            <button type="button" id="refresh-tasks">
                Refresh
            </button>
        </div>

        <div id="task-list">
            <p>Loading tasks...</p>
        </div>
    </section>

    <p id="status-message" role="status" aria-live="polite">
        Initializing application...
    </p>

    <footer>
        <a id="contribution-link" href="contribution.html">
            Team contribution
        </a>
    </footer>

</main>

</body>
</html>
